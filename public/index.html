<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>phib — shorter urls</title>
<meta name="description"
  content="Paste a long URL and get a short link back, instantly." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Phib — paste a long URL, get a short one" />
<meta property="og:description"
  content="Paste a long URL and get a short link back, instantly." />
<meta property="og:image" content="/favicons/web-app-manifest-512x512.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Phib — paste a long URL, get a short one" />
<meta name="twitter:description"
  content="Paste a long URL and get a short link back, instantly." />
<meta name="twitter:image" content="/favicons/web-app-manifest-512x512.png" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicons/favicon-96x96.png" />
<link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
<link rel="manifest" href="/favicons/site.webmanifest" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <h1>Phib<span class="dot">.</span></h1>
    <p class="subtitle">Paste a long URL, get a short one.</p>

    <form id="shorten-form">
      <input
        type="url"
        id="url-input"
        placeholder="https://example.com/a/very/long/link"
        required
      />
      <div class="row">
        <input
          type="text"
          id="custom-code"
          placeholder="custom alias (optional)"
        />
        <button type="submit">Shorten</button>
      </div>
    </form>

    <p id="error" class="error" hidden></p>

    <div id="result" class="result" hidden>
      <a id="short-link" target="_blank" rel="noopener"></a>
      <button id="copy-btn" type="button" class="copy-btn" aria-label="Copy short link">
        <span class="tooltip">Copied!</span>
        <svg class="icon icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg class="icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>

    <ul id="history" class="history"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
