<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- video.twimg.com rejects requests with a Referer from another site -->
  <meta name="referrer" content="no-referrer" />

  <title>phib — shorter urls</title>
  <meta name="description" content="Paste a long URL and get a short link back, instantly." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Phib — paste a long URL, get a short one" />
  <meta property="og:description" content="Paste a long URL and get a short link back, instantly." />
  <meta property="og:image" content="/favicons/web-app-manifest-512x512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Phib — paste a long URL, get a short one" />
  <meta name="twitter:description" content="Paste a long URL and get a short link back, instantly." />
  <meta name="twitter:image" content="/favicons/web-app-manifest-512x512.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicons/favicon-96x96.png" />
  <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
  <link rel="manifest" href="/favicons/site.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main class="card">
    <h1 class="logo" aria-label="Phib"><span aria-hidden="true">P<span class="logo-extra"><span>h</span><span>h</span><span>h</span><span>h</span></span>hib<span class="logo-dot">.</span></span></h1>
    <p class="subtitle">Paste a long URL, get a short one.</p>

    <form id="shorten-form">
      <div class="row">
        <input type="url" id="url-input" placeholder="https://example.com" aria-label="Long URL" required />
        <button type="submit">Shorten</button>
      </div>
      <!-- Shown when the pasted link is a Twitter/X post or YouTube video -->
      <div id="choice" class="choice" hidden>
        <span id="choice-label" class="choice-label"></span>
        <button type="button" id="choice-short" class="choice-btn">Short link</button>
        <button type="button" id="choice-view" class="choice-btn choice-btn-primary"></button>
      </div>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <div id="result" class="result" hidden>
      <a id="short-link" target="_blank" rel="noopener"></a>
      <button id="copy-btn" type="button" class="copy-btn" aria-label="Copy short link">
        <span class="tooltip">Copied!</span>
        <svg class="icon icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <svg class="icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </button>
    </div>

    <div id="tweet-layout" class="tweet-layout" hidden>
      <!-- Filled by public/post.js, as lib/watch.js fills the page a short link opens -->
      <article id="tweet-post" class="tweet"></article>

      <section id="comments" class="comments" hidden></section>
    </div>

    <div id="youtube-layout" class="tweet-layout" hidden>
      <div class="tweet">
        <div class="tweet-media">
          <img id="youtube-backdrop" class="tweet-media-backdrop" alt="" />
          <iframe id="youtube-player" class="tweet-video youtube-player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <p id="youtube-title" class="tweet-text youtube-title"></p>
        <p class="tweet-meta">
          <a id="youtube-channel" target="_blank" rel="noopener"></a> ·
          <a id="youtube-link" target="_blank" rel="noopener">Watch on YouTube</a>
        </p>
      </div>
    </div>

    <!-- The history stays folded away behind a small toggle. -->
    <div id="history-bar" class="history-bar" hidden>
      <button id="history-toggle" type="button" class="history-toggle" aria-expanded="false" aria-controls="history">
        <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9" />
        </svg>
        <span>History</span>
        <span id="history-count" class="history-count"></span>
      </button>
      <button id="clear-btn" type="button" class="clear-btn" aria-label="Clear the history of links.">
        clear
      </button>
    </div>
    <ul id="history" class="history" hidden></ul>

  </main>

  <a class="support" href="https://ko-fi.com/bankosegger/goal?g=0" target="_blank" rel="noopener">support phib</a>

  <script src="post.js"></script>
  <script src="comments.js"></script>
  <script src="script.js"></script>
  <script src="https://bankosegger.me/banko-tag.js" defer></script>

</body>

</html>
